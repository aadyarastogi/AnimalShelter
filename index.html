<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animal Shelter Login</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #4A55A2;
            --light-gray: #F1F5F9;
            --dark-gray: #334155;
            --white: #FFFFFF;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--light-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--dark-gray);
        }

        .login-container {
            background-color: var(--white);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        
        .login-header {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.75rem;
            color: var(--primary-color);
            margin-bottom: 2.5rem; /* Increased margin */
        }

        .login-header i { font-size: 2.5rem; }
        .login-header h2 { margin: 0; font-size: 2rem; font-weight: 600; }

        /* Styles for the new login options */
        .login-options {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        
        .login-options p {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--dark-gray);
        }

        .login-options a {
            display: block;
            padding: 1rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
        }

        .login-options a:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Unique styles for each button */
        .demo-admin { 
            background-color: #FEE2E2; 
            color: #DC2626; 
            border: 1px solid #FCA5A5;
        }
        .demo-staff { 
            background-color: #E0E7FF; 
            color: #4338CA; 
            border: 1px solid #C7D2FE;
        }
        .demo-volunteer { 
            background-color: #FEF3C7; 
            color: #B45309; 
            border: 1px solid #FDE68A;
        }
        
    </style>
</head>
<body>

    <div class="login-container">
        
        <div class="login-header">
            <i class="fa-solid fa-shield-heart"></i>
            <h2> Welcome To Animal Shelter <h2>
        </div>
        
        <div class="login-options">
            <p>Select your role to begin:</p>
            
            <a href="/admin_dashboard.html" class="demo-admin">
                <i class="fa-solid fa-user-shield"></i>
                Login as Admin
            </a>
            
            <a href="/staff_dashboard.html" class="demo-staff">
                <i class="fa-solid fa-clipboard-user"></i>
                Login as Staff
            </a>
            
            <a href="/volunteer_dashboard.html" class="demo-volunteer">
                <i class="fa-solid fa-hand-holding-heart"></i>
                Login as Volunteer
            </a>
        </div>
        
    </div>

</body>
</html>
